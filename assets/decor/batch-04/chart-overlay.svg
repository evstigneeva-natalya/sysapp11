<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1131" viewBox="0 0 800 1131" role="img" aria-labelledby="title desc">
 <title id="title">Увольнения за квартал: факт и целевой предел</title>
 <desc id="desc">Факт — 5 увольнений. Целевой предел — не более 2. Оба столбца начинаются с нуля и используют единую линейную шкалу.</desc>
