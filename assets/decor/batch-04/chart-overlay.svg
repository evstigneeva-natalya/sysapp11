  <g stroke="#D7CEC3" stroke-width="1">
   <path d="M155 260H675M155 340H675M155 420H675M155 500H675M155 580H675"/>
  </g>
  <path d="M155 250V660H675" fill="none" stroke="#8E8277" stroke-width="2"/>
  <g font-size="20" text-anchor="end" fill="#54545B"><text x="137" y="667">0</text><text x="137" y="587">1</text><text x="137" y="507">2</text><text x="137" y="427">3</text><text x="137" y="347">4</text><text x="137" y="267">5</text></g>
  <rect x="235" y="500" width="112" height="160" fill="#8E8277"/>
  <rect x="475" y="260" width="112" height="400" fill="#70304D"/>
  <g font-size="26" text-anchor="middle"><text x="291" y="480">2</text><text x="531" y="240">5</text></g>
  <g font-size="22" text-anchor="middle"><text x="291" y="707">Цель ≤ 2</text><text x="531" y="707">Факт 5</text></g>
